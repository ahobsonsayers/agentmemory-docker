name: Update Version

on:
  schedule:
    - cron: "0 1 * * *" # Every day at 1am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current version
        id: get-current-version
        run: |
          CURRENT_AGENTMEMORY_VERSION=$(
            grep "^ARG AGENTMEMORY_VERSION=" Dockerfile |
            cut -d '=' -f2
          )

          echo "agentmemory=$CURRENT_AGENTMEMORY_VERSION" >> $GITHUB_OUTPUT

          echo "
          Current agentmemory version: $CURRENT_AGENTMEMORY_VERSION
          "

      - name: Get latest version
        id: get-latest-version
        run: |
          LATEST_AGENTMEMORY_VERSION=$(
            curl -s "https://api.github.com/repos/rohitg00/agentmemory/tags?per_page=1" |
            jq -r '.[0].name' |
            sed 's/^v//'
          )

          echo "agentmemory=$LATEST_AGENTMEMORY_VERSION" >> $GITHUB_OUTPUT

          echo "
          Latest agentmemory version: $LATEST_AGENTMEMORY_VERSION
          "

      - name: Compare and update version
        id: compare-update
        run: |
          if [ "$CURRENT_AGENTMEMORY_VERSION" != "$LATEST_AGENTMEMORY_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
        env:
          CURRENT_AGENTMEMORY_VERSION: ${{ steps.get-current-version.outputs.agentmemory }}
          LATEST_AGENTMEMORY_VERSION: ${{ steps.get-latest-version.outputs.agentmemory }}

      - name: Update Dockerfile
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          sed -i "s|ARG AGENTMEMORY_VERSION=.*|ARG AGENTMEMORY_VERSION=$LATEST_AGENTMEMORY_VERSION|" Dockerfile
        env:
          LATEST_AGENTMEMORY_VERSION: ${{ steps.get-latest-version.outputs.agentmemory }}

      - name: Commit and push
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "Update agentmemory to $LATEST_AGENTMEMORY_VERSION"
          git push
        env:
          LATEST_AGENTMEMORY_VERSION: ${{ steps.get-latest-version.outputs.agentmemory }}
