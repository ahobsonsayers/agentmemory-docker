name: Build & Push

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yaml
      - Dockerfile
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:

env:
  DOCKER_IMAGE: arranhs/agentmemory

jobs:
  get-tags:
    name: Get tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.get-tags.outputs.tags }}

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Get tags
        id: get-tags
        run: |
          AGENTMEMORY_VERSION=$(
            grep "^ARG AGENTMEMORY_VERSION=" Dockerfile | 
            cut -d '=' -f2
          )

          {
            echo "tags<<EOF"
            echo "latest"
            echo "$AGENTMEMORY_VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  
          echo "
          Output:
          tags: latest, $AGENTMEMORY_VERSION
          "

  build:
    name: Build image
    needs: get-tags
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform-slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform-slug: linux-arm64

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        id: login-dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push digest
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Output digest
        id: output-digest
        uses: GoCodeAlone/github-action-matrix-outputs-write@1.0.3
        with:
          matrix-step-name: build
          matrix-key: ${{ matrix.platform-slug }}
          outputs: |
            digest: ${{ steps.build-and-push.outputs.digest }}

  push-tags:
    name: Push tags
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Get digests
        id: get-digests
        uses: GoCodeAlone/github-action-matrix-outputs-read@1.0.6
        with:
          matrix-step-name: build

      - name: Login to Dockerhub
        id: login-dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push tags
        id: push-tags
        run: |
          IMAGE_NAME="${{ env.DOCKER_IMAGE }}"
          TAGS_INPUT="${{ needs.get-tags.outputs.tags }}"

          TAGS_FLAGS=""
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            TAGS_FLAGS="$TAGS_FLAGS -t $IMAGE_NAME:$TAG"
          done <<<"$TAGS_INPUT"

          DIGESTS=$(
            echo "$DIGESTS_JSON" |
            jq -r --arg IMAGE_NAME "$IMAGE_NAME" \
              '.digest | to_entries[] | "\($IMAGE_NAME)@\(.value)"'
          )

          docker buildx imagetools create \
            $TAGS_FLAGS \
            $DIGESTS

          echo "
          Tags: $TAGS_INPUT
          Digests: $DIGESTS
          "
        env:
          DIGESTS_JSON: ${{ steps.get-digests.outputs.result }}
