name: Build & Push

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yaml
      - Dockerfile
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:

env:
  DOCKER_IMAGE: arranhs/agentmemory

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          AGENTMEMORY_VERSION=$(
            grep "^ARG AGENTMEMORY_VERSION=" Dockerfile |
            cut -d '=' -f2
          )

          echo "version=$AGENTMEMORY_VERSION" >> $GITHUB_OUTPUT

          echo "
          Agentmemory version: $AGENTMEMORY_VERSION
          "

  build:
    name: Build Image
    needs: get-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform-slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform-slug: linux-arm64

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        id: login-dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push digest
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Output digest
        id: output-digest
        uses: GoCodeAlone/github-action-matrix-outputs-write@1.0.3
        with:
          matrix-step-name: build
          matrix-key: ${{ matrix.platform-slug }}
          outputs: |
            digest: ${{ steps.build-and-push.outputs.digest }}

  push-tags:
    name: Push Tags
    runs-on: ubuntu-latest
    needs: [get-version, build]
    timeout-minutes: 10

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get digests
        id: get-digests
        uses: GoCodeAlone/github-action-matrix-outputs-read@1.0.6
        with:
          matrix-step-name: build

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push tags
        run: |
          DIGESTS=$(
            echo "$DIGESTS_JSON" |
            jq -r --arg docker_image "$DOCKER_IMAGE" \
              '.digest | to_entries[] | "\($docker_image)@\(.value)"'
          )

          docker buildx imagetools create \
            -t "$DOCKER_IMAGE:latest" \
            -t "$DOCKER_IMAGE:$AGENTMEMORY_VERSION" \
            $DIGESTS
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          AGENTMEMORY_VERSION: ${{ needs.get-version.outputs.version }}
          DIGESTS_JSON: ${{ steps.get-digests.outputs.result }}
